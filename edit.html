
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subscription</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="edit.js"></script>
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1>Edit Subscription</h1>
            <p>Update your subscription details.</p>
            <a href="subscriptions.html">← Back to Subscriptions</a>
        </header>

        <section class="card section">

            <form id="editForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="service">Service</label>
                        <input type="text" id="service" required>
                    </div>

                    <div class="form-group">
                        <label for="provider">Provider</label>
                        <input type="text" id="provider" required>
                    </div>

                    <div class="form-group">
                        <label for="subscriber">Subscriber</label>
                        <input type="text" id="subscriber" required>
                    </div>

                    <div class="form-group">
                        <label for="renewalDate">Renewal Date</label>
                        <input type="date" id="renewalDate" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Music">Music</option>
                            <option value="Software">Software</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="button button-primary">
                    Save Changes
                </button>

            </form>

        </section>

    </main>

</body>
</html>
