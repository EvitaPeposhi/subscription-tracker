
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>

    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="page-header">
            <h1>Subscription Tracker</h1>
            <p>Manage and keep track of your subscriptions.</p>
        </header>

        <!-- Summary Section -->
        <section class="summary-grid">

            <article class="card summary-card">
                <h2>Total Subscriptions</h2>
                <p id="totalSubscriptions" class="summary-number">0</p>
            </article>

            <article class="card summary-card">
                <h2>Expired Subscriptions</h2>
                <p id="expiredSubscriptions" class="summary-number">0</p>
            </article>

        </section>

        <!-- Add Subscription Form -->
        <section class="card section">

            <h2>Add a Subscription</h2>

            <form id="subscriptionForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="service">Service</label>
                        <input
                            type="text"
                            id="service"
                            placeholder="e.g. Netflix"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="provider">Provider</label>
                        <input
                            type="text"
                            id="provider"
                            placeholder="e.g. Netflix Inc."
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="subscriber">Subscriber</label>
                        <input
                            type="text"
                            id="subscriber"
                            placeholder="e.g. John"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="renewalDate">Renewal Date</label>
                        <input
                            type="date"
                            id="renewalDate"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Music">Music</option>
                            <option value="Software">Software</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="button button-primary">
                    Add Subscription
                </button>

            </form>

        </section>

        <!-- Subscriptions Table -->
        <section class="card section">

            <h2>Your Subscriptions</h2>

            <div class="table-container">

                <table class="table">

                    <thead>
                        <tr>
                            <th>Service</th>
                            <th>Provider</th>
                            <th>Subscriber</th>
                            <th>Renewal Date</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="subscriptionTable">
                        <!-- JavaScript will insert subscriptions here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>
</html>
