
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/EvitaPeposhi/subscription-tracker@main/css-library/library.css">
    <script type="module" src="app.js"></script>
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1>Subscription Tracker</h1>
            <p>Manage and keep track of your subscriptions.</p>
        </header>

        <!-- Navigation -->
        <section class="card section">
            <h2>What would you like to do?</h2>

            <a href="add.html" class="button button-primary">
                Add Subscription
            </a>

            <a href="subscriptions.html" class="button button-primary">
                View Subscriptions
            </a>
        </section>

        <!-- Dashboard Summary -->
        <section class="summary-grid">

            <div class="card summary-card">
                <h3>Total Subscriptions</h3>
                <p class="summary-number" id="totalSubscriptions">0</p>
            </div>

            <div class="card summary-card">
                <h3>Expired Subscriptions</h3>
                <p class="summary-number" id="expiredSubscriptions">0</p>
            </div>

        </section>

    </main>

</body>
</html>
